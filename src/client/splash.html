<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <title>DestinyVox</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    html, body, #root {
      margin: 0;
      padding: 0;
      border: 0;
      outline: 0;
      width: 100%;
      height: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background-color: #08080c;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    @media (prefers-color-scheme: light) {
      html:not(.dark), body:not(.dark), #root:not(.dark) {
        background-color: #f7f5ef;
      }
    }
  </style>
</head>

<body class="h-full">
  <div id="root" class="h-full"></div>
  <script type="module" src="splash.tsx"></script>
</body>

</html>
